<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sahyadri HRIS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* Layout: left rail nav + working canvas; on phones the rail becomes a scrolling tab strip */
:root{
  --ink:#17212b; --muted:#5d6b78; --line:#dbe2e8; --bg:#f3f6f8; --surface:#ffffff; --raised:#eef3f6;
  --accent:#0b6e79; --accent-ink:#ffffff; --accent-soft:#dcefF1;
  --good:#1f7a4a; --good-soft:#dff3e7; --warn:#a15c00; --warn-soft:#fdf0d9; --bad:#b3261e; --bad-soft:#fbe3e1;
  --display:"Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --body:"IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
  --mono:"IBM Plex Mono", ui-monospace, Menlo, monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --ink:#e4ebf0; --muted:#97a6b3; --line:#2c3944; --bg:#0f161c; --surface:#161f27; --raised:#1d2832;
    --accent:#4fc0cb; --accent-ink:#06262a; --accent-soft:#163a40;
    --good:#6fd39a; --good-soft:#163526; --warn:#f0b459; --warn-soft:#3a2a10; --bad:#ff8f86; --bad-soft:#3d1a18;
    color-scheme: dark;
  }
}
:root[data-theme="dark"]{
  --ink:#e4ebf0; --muted:#97a6b3; --line:#2c3944; --bg:#0f161c; --surface:#161f27; --raised:#1d2832;
  --accent:#4fc0cb; --accent-ink:#06262a; --accent-soft:#163a40;
  --good:#6fd39a; --good-soft:#163526; --warn:#f0b459; --warn-soft:#3a2a10; --bad:#ff8f86; --bad-soft:#3d1a18;
  color-scheme: dark;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.5 var(--body);}
h1,h2,h3{font-family:var(--display);font-weight:700;text-wrap:balance;margin:0;letter-spacing:-.01em}
h1{font-size:26px} h2{font-size:19px} h3{font-size:16px}
.num,td.n,.mono{font-variant-numeric:tabular-nums}
.mono{font-family:var(--mono);font-size:13px}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}

.app{display:grid;grid-template-columns:220px 1fr;grid-template-rows:auto 1fr;min-height:100%}
header.top{grid-column:1/-1;display:flex;align-items:center;gap:16px;padding:12px 20px;background:var(--surface);border-bottom:1px solid var(--line);flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--display);font-weight:700;font-size:18px}
.brand .mark{width:30px;height:30px;border-radius:8px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-size:15px}
.brand small{display:block;font-family:var(--body);font-weight:400;font-size:12px;color:var(--muted);line-height:1.1}
.top .spacer{flex:1}
.who{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted)}
.who select{padding:6px 8px;border:1px solid var(--line);border-radius:8px;background:var(--surface)}
nav.rail{background:var(--surface);border-right:1px solid var(--line);padding:14px 10px;display:flex;flex-direction:column;gap:2px}
nav.rail a{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:8px;color:var(--ink);text-decoration:none;font-weight:500}
nav.rail a:hover{background:var(--raised)}
nav.rail a.on{background:var(--accent-soft);color:var(--accent)}
nav.rail a svg{width:18px;height:18px;flex:none;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
nav.rail .foot{margin-top:auto;padding:12px;font-size:12px;color:var(--muted)}
main{padding:22px 24px 60px;min-width:0;display:flex;flex-direction:column;gap:18px}
.pagehead{display:flex;align-items:flex-end;gap:12px;flex-wrap:wrap}
.pagehead p{margin:4px 0 0;color:var(--muted)}
.pagehead .actions{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}

.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px}
.card > h2,.card > h3{margin-bottom:10px}
.grid{display:grid;gap:14px}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.stat .k{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.stat .v{font-family:var(--display);font-size:30px;font-weight:700;line-height:1.1;margin-top:4px}
.stat .s{font-size:13px;color:var(--muted)}
.list{display:flex;flex-direction:column}
.list .row{display:flex;gap:10px;align-items:center;padding:9px 0;border-top:1px solid var(--line)}
.list .row:first-child{border-top:0}
.list .row .grow{flex:1;min-width:0}
.list .row .sub{font-size:13px;color:var(--muted)}

.btn{display:inline-flex;align-items:center;gap:6px;padding:8px 14px;border-radius:8px;border:1px solid var(--line);background:var(--surface);cursor:pointer;font-weight:500;white-space:nowrap}
.btn:hover{background:var(--raised)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.pri:hover{filter:brightness(1.07)}
.btn.sm{padding:5px 10px;font-size:13px}
.btn.good{color:var(--good);border-color:var(--good)}
.btn.bad{color:var(--bad);border-color:var(--bad)}
.btn[disabled]{opacity:.5;cursor:not-allowed}

.pill{display:inline-block;padding:2px 9px;border-radius:999px;font-size:12px;font-weight:600;background:var(--raised);color:var(--muted);white-space:nowrap}
.pill.good{background:var(--good-soft);color:var(--good)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.bad{background:var(--bad-soft);color:var(--bad)}
.pill.acc{background:var(--accent-soft);color:var(--accent)}

.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{text-align:left;padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:middle;white-space:nowrap}
th{font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:600;background:var(--raised)}
tr:last-child td{border-bottom:0}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}
tbody tr.click{cursor:pointer}
tbody tr.click:hover{background:var(--raised)}
tfoot td{font-weight:600;background:var(--raised)}

.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.toolbar input,.toolbar select,.field input,.field select,.field textarea{padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--surface);min-width:0}
.toolbar input[type=search]{flex:1;min-width:180px}
.pager{display:flex;gap:8px;align-items:center;justify-content:flex-end;font-size:13px;color:var(--muted);padding:8px 2px}
.empty{padding:28px;text-align:center;color:var(--muted)}

.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);overflow-x:auto}
.tabs button{border:0;background:none;padding:9px 14px;cursor:pointer;color:var(--muted);font-weight:600;border-bottom:2px solid transparent;white-space:nowrap}
.tabs button.on{color:var(--accent);border-bottom-color:var(--accent)}

.form{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px 14px}
.field{display:flex;flex-direction:column;gap:4px}
.field.full{grid-column:1/-1}
.field label{font-size:13px;font-weight:600}
.field .hint{font-size:12px;color:var(--muted)}
.field .err{font-size:12px;color:var(--bad);min-height:0}
.field.invalid input,.field.invalid select{border-color:var(--bad)}
.section-label{grid-column:1/-1;font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600;border-top:1px solid var(--line);padding-top:12px;margin-top:4px;display:flex;gap:8px;align-items:center}

.overlay{position:fixed;inset:0;background:rgb(10 20 28 / .45);display:none;align-items:flex-start;justify-content:flex-end;z-index:20}
.overlay.open{display:flex}
.drawer{background:var(--surface);width:min(620px,100%);height:100%;overflow-y:auto;padding:20px;display:flex;flex-direction:column;gap:14px;border-left:1px solid var(--line)}
.drawer .dh{display:flex;align-items:flex-start;gap:12px}
.drawer .dh .x{margin-left:auto}
.kv{display:grid;grid-template-columns:150px 1fr;gap:6px 12px;font-size:14px}
.kv dt{color:var(--muted)} .kv dd{margin:0}
.avatar{width:40px;height:40px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font-weight:700;font-size:14px;flex:none}
.avatar.lg{width:54px;height:54px;font-size:18px}
.lock{display:inline-flex;align-items:center;gap:4px;font-size:12px;color:var(--warn)}
.note{font-size:13px;color:var(--muted);background:var(--raised);border-radius:8px;padding:10px 12px}
.note.warn{background:var(--warn-soft);color:var(--warn)}

.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-size:14px;z-index:30;opacity:0;pointer-events:none;transition:opacity .2s}
.toast.show{opacity:1}

/* org chart */
.org{overflow-x:auto;padding:8px 0}
.org ul{list-style:none;margin:0;padding:0 0 0 22px;border-left:1px dashed var(--line)}
.org > ul{border-left:0;padding-left:0}
.org li{position:relative;padding:6px 0 6px 14px}
.org ul ul li::before{content:"";position:absolute;left:-22px;top:26px;width:30px;border-top:1px dashed var(--line)}
.orgnode{display:inline-flex;gap:10px;align-items:center;padding:8px 12px;border:1px solid var(--line);border-radius:10px;background:var(--surface);cursor:pointer;text-align:left}
.orgnode:hover{border-color:var(--accent)}
.orgnode .sub{font-size:12px;color:var(--muted)}
.orgnode.me{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-soft)}

/* attendance grid */
.att td,.att th{padding:4px 0;text-align:center;font-size:11px;min-width:26px}
.att td:first-child,.att th:first-child{text-align:left;padding:4px 10px;min-width:150px;font-size:13px;position:sticky;left:0;background:var(--surface)}
.att th:first-child{background:var(--raised)}
.c{display:inline-block;width:22px;height:22px;line-height:22px;border-radius:5px;font-weight:600;font-size:10px}
.c.P{background:var(--good-soft);color:var(--good)}
.c.WO{background:transparent;color:var(--muted)}
.c.H{background:var(--accent-soft);color:var(--accent)}
.c.L{background:var(--warn-soft);color:var(--warn)}
.c.LOP{background:var(--bad-soft);color:var(--bad)}
.c.F{color:var(--line)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted);align-items:center}

/* letter */
.letter{background:#fff;color:#1b1b1b;border:1px solid var(--line);border-radius:4px;padding:34px 38px;font:14px/1.65 Georgia,"Times New Roman",serif;max-width:720px}
.letter .lh{display:flex;justify-content:space-between;align-items:flex-start;border-bottom:3px solid #0b6e79;padding-bottom:12px;margin-bottom:18px;gap:12px}
.letter .lh b{font-family:var(--display);font-size:20px;color:#0b6e79}
.letter .lh small{font-family:var(--body);font-size:11px;color:#555;text-align:right;line-height:1.4}
.letter p{margin:0 0 12px}
.letter table{font:13px/1.4 var(--body);margin:8px 0 14px;width:auto}
.letter table td,.letter table th{padding:5px 12px;border:1px solid #ccc;color:#1b1b1b;background:#fff}
.letter table th{background:#f0f4f5;text-transform:none;letter-spacing:0;font-size:12px}
.sign{margin-top:28px}

.app.locked{grid-template-columns:1fr}
.app.locked nav.rail,.app.locked .who{display:none}
.login{max-width:420px;margin:24px auto;width:100%;display:flex;flex-direction:column;gap:14px}
.login .err{color:var(--bad);font-size:14px;margin:0}
.demo{display:flex;flex-direction:column;gap:6px}
.demo button{justify-content:space-between;text-align:left}
.bar{height:8px;border-radius:99px;background:var(--raised);overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:99px}

@media (max-width: 860px){
  .app{grid-template-columns:1fr}
  nav.rail{flex-direction:row;overflow-x:auto;border-right:0;border-bottom:1px solid var(--line);padding:6px 10px;position:sticky;top:0;z-index:5}
  nav.rail a{flex:none;padding:8px 10px;font-size:14px}
  nav.rail .foot{display:none}
  main{padding:16px 16px 60px}
  .g4{grid-template-columns:repeat(2,minmax(0,1fr))}
  .g3,.g2{grid-template-columns:1fr}
  .form{grid-template-columns:1fr}
  .kv{grid-template-columns:120px 1fr}
  header.top{padding:10px 16px}
  .letter{padding:22px 20px}
}
@media (max-width: 420px){
  .stat .v{font-size:24px}
  h1{font-size:22px}
}
</style>
</head>
<body>
<div class="app locked">
  <header class="top">
    <div class="brand"><div class="mark">S</div><div>Sahyadri HRIS<small>Sahyadri Tech Pvt Ltd · Pune</small></div></div>
    <div class="spacer"></div>
    <div class="who"><span id="whoName"></span><button class="btn sm" data-a="signout">Sign out</button></div>
  </header>
  <nav class="rail" id="nav" aria-label="Modules"></nav>
  <main id="main" aria-live="polite"></main>
</div>
<div class="overlay" id="ov" role="dialog" aria-modal="true"><div class="drawer" id="drawer"></div></div>
<div class="toast" id="toast" role="status"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script>
(function(){
"use strict";
/* ---------------- helpers ---------------- */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const pad = n => String(n).padStart(2,"0");
const iso = d => d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
const P = s => { const [y,m,d] = s.split("-").map(Number); return new Date(y,m-1,d); };
const MON = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
const MONTHS = ["January","February","March","April","May","June","July","August","September","October","November","December"];
const fmt = s => { if(!s) return "—"; const d = typeof s==="string"?P(s):s; return pad(d.getDate())+" "+MON[d.getMonth()]+" "+d.getFullYear(); };
const inr = n => "₹" + Math.round(n).toLocaleString("en-IN");
const lpa = n => "₹" + (n/100000).toLocaleString("en-IN",{maximumFractionDigits:2}) + " LPA";
const TODAY = (()=>{ const t=new Date(); return new Date(t.getFullYear(),t.getMonth(),t.getDate()); })();
const TODAY_S = iso(TODAY);
const addDays = (d,n) => { const x=new Date(d); x.setDate(x.getDate()+n); return x; };
const addMonths = (s,n) => { const d=P(s); d.setMonth(d.getMonth()+n); return iso(d); };
const initials = n => n.split(" ").map(w=>w[0]).slice(0,2).join("").toUpperCase();
const nowStamp = () => { const d=new Date(); return iso(d)+" "+pad(d.getHours())+":"+pad(d.getMinutes()); };
const yearsBetween = (a,b) => (P(b)-P(a))/(365.25*864e5);

/* ---------------- policy constants ---------------- */
const HOLIDAYS = [
  ["2026-01-26","Republic Day"],["2026-03-04","Holi"],["2026-03-20","Ramzan Eid (Id-ul-Fitr)"],["2026-04-03","Good Friday"],
  ["2026-05-01","Maharashtra Day"],["2026-08-15","Independence Day"],["2026-09-14","Ganesh Chaturthi"],["2026-10-02","Gandhi Jayanti"],
  ["2026-10-20","Dussehra"],["2026-11-09","Diwali (Lakshmi Puja)"],["2026-11-10","Diwali (Balipratipada)"],["2026-11-24","Guru Nanak Jayanti"],["2026-12-25","Christmas"]
];
const HSET = new Set(HOLIDAYS.map(h=>h[0]));
const LEAVE_TYPES = {
  CL:{name:"Casual leave", annual:8, calendar:false, note:"Max 3 days at a stretch; no carry-forward"},
  SL:{name:"Sick leave", annual:8, calendar:false, note:"Medical certificate if more than 2 days"},
  EL:{name:"Earned leave", annual:18, calendar:false, note:"Accrues 1.5 days/month; carry forward up to 30"},
  ML:{name:"Maternity leave", annual:182, calendar:true, note:"26 weeks (Maternity Benefit Act)"},
  PL:{name:"Paternity leave", annual:5, calendar:false, note:"Within 3 months of birth"},
  LOP:{name:"Loss of pay", annual:null, calendar:false, note:"Unpaid; reduces payable days"}
};
const ROLES = {
  hr_admin:{me:"EMP002", label:"HR Admin"},
  manager:{me:"EMP004", label:"Manager"},
  employee:{me:"EMP009", label:"Employee"}
};

/* ---------------- Supabase ---------------- */
const SUPABASE_URL = "https://qonjlwsyjknvxqmochjk.supabase.co";
// Publishable key: safe to ship in the browser. What each person can read or change is enforced by Row Level Security in the database.
const SUPABASE_KEY = "sb_publishable_9t9fr_1nE1yNX73Je398pA_QvyeDQyY";
// Sign-in is handled by Clerk. Clerk's session token is passed to Supabase (third-party auth),
// and the database identifies the person by the verified email claim in that token.
const CLERK_PUBLISHABLE_KEY = "__CLERK_KEY__";
const db = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY, {
  accessToken: async () => (window.Clerk && window.Clerk.session) ? await window.Clerk.session.getToken() : null
});
let S = {employees:[], leaves:[], attendance:{}, audit:[], seq:{letter:1}};
let role = null, ME = null;
const me = () => ME;
const emp = id => S.employees.find(e=>e.id===id);
const ename = id => (emp(id)||{name:id||"—"}).name;
const log = act => { S.audit.unshift({at:nowStamp(), by:me(), act}); return db.from("audit_log").insert({by_employee:me(), action:act}).then(({error})=>{ if(error) console.warn("audit:", error.message); }); };

async function loadAll(){
  const monthStart = TODAY.getFullYear()+"-"+pad(TODAY.getMonth()+1)+"-01";
  const res = await Promise.all([
    db.from("employees").select("*").order("id"),
    db.from("employee_sensitive").select("*"),
    db.from("leave_requests").select("*").order("id"),
    db.from("documents").select("*").order("doc_date").order("created_at"),
    db.from("attendance").select("*").gte("day", monthStart),
    role==="hr_admin" ? db.from("audit_log").select("*").order("at",{ascending:false}).limit(300) : Promise.resolve({data:[]})
  ]);
  const bad = res.find(r=>r.error); if(bad) throw bad.error;
  const [e,s,l,d,a,au] = res.map(r=>r.data||[]);
  const sens = Object.fromEntries(s.map(x=>[x.employee_id,x]));
  S.employees = e.map(x=>{ const z=sens[x.id]||{}; return {
    id:x.id, name:x.name, email:x.email, phone:x.phone, designation:x.designation, dept:x.dept, manager:x.manager_id,
    doj:x.doj, location:x.location, type:x.type, status:x.status, lwd:x.lwd, elCarry:+x.el_carry,
    ctc: z.ctc!=null ? +z.ctc : undefined, gender:z.gender, pan:z.pan, uan:z.uan||"", aadhaarLast4:z.aadhaar_last4, bankLast4:z.bank_last4||"",
    docs: d.filter(q=>q.employee_id===x.id).map(q=>({id:q.id, name:q.name, kind:q.kind, date:q.doc_date, status:q.status}))
  }; });
  S.leaves = l.map(x=>({id:x.id, emp:x.employee_id, type:x.type, from:x.from_date, to:x.to_date, status:x.status, reason:x.reason, applied:x.applied_on, history:x.history||[]}));
  S.attendance = {};
  a.forEach(x=>{ (S.attendance[x.employee_id] = S.attendance[x.employee_id]||{})[x.day] = {in:x.check_in, out:x.check_out}; });
  S.audit = au.map(x=>{ const t=new Date(x.at); return {at:iso(t)+" "+pad(t.getHours())+":"+pad(t.getMinutes()), by:x.by_employee, act:x.action}; });
  S.seq.letter = S.employees.reduce((n,x)=>n+x.docs.filter(q=>q.kind==="Letter"&&/ref \d+/.test(q.name)).length,0)+1;
}
// Write to the database, then reload so the screen always shows what the database holds
async function mutate(op, {ok, logMsg, after}={}){
  document.body.style.cursor="progress";
  let error = null;
  try { const r = await op; error = r && r.error; } catch(e){ error = e; }
  if(!error && logMsg) await log(logMsg);
  try { await loadAll(); } catch(e){ error = error || e; }
  document.body.style.cursor="";
  render();
  if(error){ toast("Couldn't save: "+(error.message||error)); return false; }
  if(ok) toast(ok);
  if(after) after();
  return true;
}
// Run dependent writes in order, stopping at the first error
const chain = (...steps) => (async()=>{ let prev; for(const st of steps){ const r = await st(prev); if(r && r.error) return r; prev = r; } return prev||{}; })();
const toast = m => { const t=$("#toast"); t.textContent=m; t.classList.add("show"); clearTimeout(t._h); t._h=setTimeout(()=>t.classList.remove("show"),2400); };

/* ---------------- leave engine ---------------- */
function leaveDays(type, from, to){
  let d=P(from), end=P(to), n=0;
  while(d<=end){
    const s=iso(d), wd=d.getDay();
    if(LEAVE_TYPES[type].calendar || (wd!==0 && wd!==6 && !HSET.has(s))) n++;
    d=addDays(d,1);
  }
  return n;
}
function daysInYear(l, year){
  const a = l.from < year+"-01-01" ? year+"-01-01" : l.from;
  const b = l.to > year+"-12-31" ? year+"-12-31" : l.to;
  return a>b ? 0 : leaveDays(l.type,a,b);
}
function balances(id){
  const e=emp(id), year=TODAY.getFullYear(), out={};
  const startMonth = e.doj > year+"-01-01" ? P(e.doj).getMonth() : 0;
  const monthsServed = Math.max(0, TODAY.getMonth() - startMonth + 1);
  const prorate = e.doj > year+"-01-01" ? (12-startMonth)/12 : 1;
  for(const [k,t] of Object.entries(LEAVE_TYPES)){
    if(k==="LOP") continue;
    if(k==="ML" && e.gender && e.gender!=="F") continue;
    if(k==="PL" && e.gender && e.gender!=="M") continue;
    let ent = t.annual;
    if(k==="CL"||k==="SL") ent = Math.floor(t.annual*prorate);
    if(k==="EL") ent = +(Math.min(18, monthsServed*1.5) + (e.doj > year+"-01-01" ? 0 : e.elCarry)).toFixed(1);
    if(e.type==="Intern" && k==="EL") ent = 0;
    const used = S.leaves.filter(l=>l.emp===id&&l.type===k&&l.status==="Approved").reduce((a,l)=>a+daysInYear(l,year),0);
    const pending = S.leaves.filter(l=>l.emp===id&&l.type===k&&l.status.startsWith("Pending")).reduce((a,l)=>a+daysInYear(l,year),0);
    out[k]={ent,used,pending,left:+(ent-used-pending).toFixed(1)};
  }
  return out;
}
function onLeave(id, dateS){ return S.leaves.find(l=>l.emp===id && l.status==="Approved" && l.from<=dateS && l.to>=dateS); }
function approver(l){
  if(l.status==="Pending manager") return emp(l.emp).manager || "EMP002";
  if(l.status==="Pending HR") return "EMP002";
  return null;
}
function canAct(l){
  if(role==="hr_admin" && l.status.startsWith("Pending")) return true;
  if(role==="manager" && l.status==="Pending manager" && allReports(me()).some(r=>r.id===l.emp)) return true;
  return false;
}

/* ---------------- payroll inputs ---------------- */
function ptFor(e, gross, monthIdx){
  if(e.location==="Bengaluru") return gross>=25000 ? 200 : 0;
  if(e.gender==="F") return gross>25000 ? 200 : 0;
  if(gross<=7500) return 0;
  if(gross<=10000) return 175;
  return monthIdx===1 ? 300 : 200;
}
function lopDays(id, y, m){
  const a=y+"-"+pad(m+1)+"-01", b=iso(new Date(y,m+1,0));
  return S.leaves.filter(l=>l.emp===id&&l.type==="LOP"&&l.status==="Approved").reduce((n,l)=>{
    const f=l.from<a?a:l.from, t=l.to>b?b:l.to; return f>t?n:n+leaveDays("LOP",f,t);
  },0);
}
function pay(e, y, m){
  const ctcM = Math.round(e.ctc/12);
  const basic = Math.round(ctcM*0.5);
  const erPFfull = Math.round(Math.min(basic,15000)*0.12);
  const grat = Math.round(basic*0.0481);
  const gross = ctcM - erPFfull - grat;
  const hra = Math.round(basic*0.4);
  const special = gross - basic - hra;
  const dim = new Date(y,m+1,0).getDate();
  let start=1, end=dim;
  const ms = y+"-"+pad(m+1);
  if(e.doj.slice(0,7)===ms) start = P(e.doj).getDate();
  if(e.doj.slice(0,7) > ms) return null;
  if(e.lwd && e.lwd.slice(0,7)===ms) end = P(e.lwd).getDate();
  if(e.lwd && e.lwd.slice(0,7) < ms) return null;
  const lop = lopDays(e.id,y,m);
  const payable = Math.max(0,(end-start+1)-lop);
  const f = payable/dim;
  const eGross = Math.round(gross*f), eBasic = Math.round(basic*f);
  const pfWage = Math.min(eBasic,15000);
  const eePF = Math.round(pfWage*0.12);
  const eps = Math.round(pfWage*0.0833);
  const erDiff = eePF - eps;
  const esiApplies = gross<=21000;
  const eeESI = esiApplies ? Math.ceil(eGross*0.0075) : 0;
  const erESI = esiApplies ? Math.ceil(eGross*0.0325) : 0;
  const pt = ptFor(e, eGross, m);
  const ncp = dim - payable;
  return {ctcM,basic,hra,special,gross,erPFfull,grat,dim,payable,lop,ncp,eGross,eBasic,pfWage,eePF,eps,erDiff,esiApplies,eeESI,erESI,pt,net:eGross-eePF-eeESI-pt};
}

function validateEmp(form){
  const v = Object.fromEntries(new FormData(form).entries());
  const errs = {};
  v.name=v.name.trim(); v.pan=v.pan.trim().toUpperCase(); v.email=v.email.trim().toLowerCase();
  v.aadhaarLast4 = v.aadhaarLast4.replace(/\D/g,"");
  let aadNote = "";
  if(v.aadhaarLast4.length===12){ v.aadhaarLast4=v.aadhaarLast4.slice(-4); aadNote=" Only the last 4 Aadhaar digits were kept."; }
  if(v.name.length<3) errs.name="Enter the full name (at least 3 letters).";
  if(!/^[a-z0-9._-]+@sahyadritech\.in$/.test(v.email)) errs.email="Use a company address like name.surname@sahyadritech.in.";
  else if(S.employees.some(x=>x.email===v.email && x.id!==form.dataset.id)) errs.email="Another employee already uses this email.";
  if(!/^[6-9]\d{9}$/.test(v.phone)) errs.phone="Enter a 10-digit Indian mobile number starting with 6–9.";
  if(!v.designation.trim()) errs.designation="Enter a designation.";
  if(!v.doj) errs.doj="Pick the joining date.";
  if(!(+v.ctc>0)) errs.ctc="Enter the annual CTC in rupees.";
  else if(+v.ctc<120000) errs.ctc="CTC looks too low. Check it is annual, not monthly.";
  if(!v.gender) errs.gender="Choose an option.";
  if(!/^[A-Z]{5}\d{4}[A-Z]$/.test(v.pan)) errs.pan="PAN must be 5 letters, 4 digits, 1 letter (ABCDE1234F).";
  if(v.uan && !/^\d{12}$/.test(v.uan)) errs.uan="UAN must be exactly 12 digits.";
  if(!/^\d{4}$/.test(v.aadhaarLast4)) errs.aadhaarLast4="Enter the last 4 digits of Aadhaar.";
  if(v.bankLast4 && !/^\d{4}$/.test(v.bankLast4)) errs.bankLast4="Enter exactly 4 digits.";
  form.querySelectorAll(".field").forEach(f=>{ const k=f.dataset.f; f.classList.toggle("invalid",!!errs[k]); const er=f.querySelector(".err"); if(er) er.textContent=errs[k]||""; });
  return {v, errs, aadNote};
}

      <p>Your date of joining will be <b>${fmt(o.date||e.doj)}</b>. Your annual cost to company will be <b>${lpa(o.ctc||e.ctc)}</b>, structured as follows:</p>${ctcTable}
      <p>You will be on probation for six months from your date of joining. During probation either party may end employment with 15 days' notice; after confirmation the notice period is 60 days.</p>

    promotion:`<p>Dear ${first},</p><p>In recognition of your performance, we are delighted to promote you to <b>${esc(o.desig||e.designation)}</b> with effect from <b>${fmt(o.date||TODAY_S)}</b>.</p><p>Your revised annual cost to company will be <b>${lpa(o.ctc||e.ctc)}</b>, structured as follows:</p>${ctcTable}<p>Congratulations on this well-deserved step.</p>`,
    relieving:`<p>Dear ${first},</p><p>This is with reference to your resignation. We confirm that you are relieved from your duties as <b>${esc(e.designation)}</b> at Sahyadri Tech Pvt Ltd at the close of business on <b>${fmt(o.date||e.lwd||TODAY_S)}</b>.</p><p>Your full and final settlement, including gratuity where applicable, will be processed within 30 days of your last working day. Please complete the asset handover with the Admin team.</p><p>We thank you for your contributions and wish you success in the future.</p>`,

  };

    <p class="note">ESI covers employees whose gross is ₹21,000 a month or less. Total to remit: ${inr(T(esiRows,"eeESI")+T(esiRows,"erESI"))}.</p>`:'<div class="empty card">No employees are covered by ESI this month.</div>';
  } else if(ui.compTab==="pt"){
    const tbl = (arr,state,rule) => `<div class="card"><h3>${state}</h3><p style="font-size:13px;color:var(--muted);margin:2px 0 10px">${rule}</p><div class="tablewrap"><table><thead><tr><th>Employee</th><th class="n">Gross</th><th class="n">PT</th></tr></thead><tbody>${arr.map(({e,p})=>`<tr><td>${esc(e.name)}</td><td class="n">${inr(p.eGross)}</td><td class="n">${inr(p.pt)}</td></tr>`).join("")}</tbody><tfoot><tr><td>${arr.length} employees</td><td></td><td class="n">${inr(T(arr,"pt"))}</td></tr></tfoot></table></div></div>`;

  } else {
    const g = S.employees.filter(e=>e.status!=="Exited").map(e=>{ const yrs=yearsBetween(e.doj,TODAY_S); const p=pay(Object.assign({},e,{lwd:null}),TODAY.getFullYear(),TODAY.getMonth())||pay(Object.assign({},e,{doj:"2000-01-01"}),TODAY.getFullYear(),TODAY.getMonth()); const done=Math.floor(yrs)+((yrs%1)>=0.5?1:0); return {e,yrs,basic:p.basic,amt:Math.min(2000000,Math.round(15/26*p.basic*done)),eligible:yrs>=4.75}; });
    body = `<div class="tablewrap"><table><thead><tr><th>Employee</th><th class="n">Service</th><th class="n">Last basic</th><th class="n">Gratuity if leaving now</th><th>Status</th></tr></thead>

    <tfoot><tr><td colspan="3">Accrued liability (eligible employees)</td><td class="n">${inr(g.filter(r=>r.eligible).reduce((a,r)=>a+r.amt,0))}</td><td></td></tr></tfoot></table></div>
    <p class="note">Formula: 15 ÷ 26 × last basic × completed years (6 months or more rounds up), capped at ₹20 lakh. Payable within 30 days of exit. Fixed-term staff may qualify earlier under the new labour codes; check before settlement.</p>`;

  return `<div class="pagehead"><div><h1>Compliance reports</h1><p>Monthly statutory returns built from payroll inputs.</p></div><div class="actions"><select id="compMonth" aria-label="Wage month">${monthOptions(ms)}</select></div></div>

}
function ecrText(){
  const ms = ui.compMonth || curMonth();
  const [y,mm]=ms.split("-").map(Number);
  return S.employees.map(e=>({e,p:pay(e,y,mm-1)})).filter(r=>r.p&&r.e.uan).map(({e,p})=>[e.uan,e.name.toUpperCase(),p.eGross,p.pfWage,p.pfWage,p.pfWage,p.eePF,p.eps,p.erDiff,p.ncp,0].join("#~#")).join("\n");
}

/* ---------------- Clipboard ---------------- */
async function copy(text, msg){
  try{ await navigator.clipboard.writeText(text); toast(msg||"Copied"); }
  catch(e){ openDrawer(`<div class="dh"><h2>Copy this text</h2><button class="btn sm x" data-a="close">Close</button></div><p style="color:var(--muted);margin:0">Your browser blocked automatic copying. Select all and copy.</p><textarea style="width:100%;height:60vh;font:12px var(--mono);padding:10px;border:1px solid var(--line);border-radius:8px;background:var(--surface)" readonly>${esc(text)}</textarea>`); }
}

/* ---------------- Events ---------------- */
function actLeave(id, ok){
  const l = S.leaves.find(x=>x.id===id); if(!l||!canAct(l)) return;
  const days = leaveDays(l.type,l.from,l.to), calSpan = (P(l.to)-P(l.from))/864e5;
  let status, act, msg, logMsg;
  if(!ok){ status="Rejected"; act="Rejected"; msg="Leave rejected. "+ename(l.emp).split(" ")[0]+" will see it in their requests."; logMsg=`Rejected ${l.id} for ${ename(l.emp)}`; }
  else if(l.status==="Pending manager" && role!=="hr_admin" && (days>5 || calSpan>=5 || l.type==="ML")){ status="Pending HR"; act="Approved by manager, sent to HR"; msg="Approved and sent to HR, since it is over 5 days."; logMsg=`Approved ${l.id} for ${ename(l.emp)} at manager level; sent to HR (${days} days)`; }
  else { status="Approved"; act="Approved"; msg="Leave approved."; logMsg=`Approved ${l.id} for ${ename(l.emp)} (${l.type}, ${days} days)`; }
  mutate(db.from("leave_requests").update({status, history:[...l.history,{at:nowStamp(),by:me(),act}]}).eq("id",id), {ok:msg, logMsg});
}
document.addEventListener("click", e=>{
  const t = e.target.closest("[data-a]"); if(!t) return;
  const a=t.dataset.a, id=t.dataset.id;
  if(t.tagName==="A") return;
  switch(a){
    case "signout": window.Clerk.signOut().then(()=>{ history.replaceState(null,"",location.pathname); showLogin(); }); break;
    case "close": closeDrawer(); break;
    case "openEmp":
      if(!visibleEmps().some(x=>x.id===id) && role!=="hr_admin"){
        const x=emp(id); openDrawer(`<div class="dh"><div class="avatar lg">${initials(x.name)}</div><div><h2>${esc(x.name)}</h2><div style="color:var(--muted)">${esc(x.designation)} · ${esc(x.dept)}</div><div style="margin-top:6px">${esc(x.email)}</div></div><button class="btn sm x" data-a="close">Close</button></div><p class="note">You can see the work contact details of colleagues outside your reporting line.</p>`); break; }
      openDrawer(empDetail(id)); if(role==="hr_admin") log(`Viewed record of ${ename(id)} (${id})`); break;
    case "dtab": { const root=t.closest(".drawer,.card"); root.querySelectorAll(".tabs button").forEach(b=>b.classList.toggle("on",b===t)); root.querySelectorAll("[data-pane]").forEach(p=>p.hidden=p.dataset.pane!==t.dataset.t); if(t.dataset.t==="pay") log(`Viewed salary and ID fields of ${ename(root.querySelector("[data-a=editEmp]")?.dataset.id||"")}`); break; }
    case "newEmp": openDrawer(empForm(null)); break;
    case "editEmp": openDrawer(empForm(id)); break;
    case "pg": ui.page+=+t.dataset.d; render(); break;
    case "approve": actLeave(id,true); break;
    case "reject": actLeave(id,false); break;
    case "cancelLeave": { const l=S.leaves.find(x=>x.id===id); mutate(db.from("leave_requests").update({status:"Withdrawn", history:[...l.history,{at:nowStamp(),by:me(),act:"Withdrawn"}]}).eq("id",id), {ok:"Request withdrawn.", logMsg:`Withdrew leave ${id}`}); break; }
    case "leaveHist": { const l=S.leaves.find(x=>x.id===id); openDrawer(`<div class="dh"><div><h2>${esc(ename(l.emp))} · ${LEAVE_TYPES[l.type].name}</h2><div style="color:var(--muted)">${fmt(l.from)} to ${fmt(l.to)} · ${leaveDays(l.type,l.from,l.to)} day(s)</div></div><button class="btn sm x" data-a="close">Close</button></div><div class="list">${l.history.map(h=>`<div class="row"><div class="grow"><b>${esc(h.act)}</b><div class="sub">${esc(ename(h.by))} · ${esc(h.at)}</div></div></div>`).join("")}</div>`); break; }
    case "ltab": ui.leaveTab=t.dataset.t; render(); break;
    case "ctab": ui.compTab=t.dataset.t; render(); break;
    case "clock": { const d=new Date(), tm=pad(d.getHours())+":"+pad(d.getMinutes()); const r=(S.attendance[me()]||{})[TODAY_S];
      if(!r) mutate(db.from("attendance").insert({employee_id:me(), day:TODAY_S, check_in:tm}), {ok:"Checked in at "+tm, logMsg:"Checked in at "+tm});
      else if(!r.out) mutate(db.from("attendance").update({check_out:tm}).eq("employee_id",me()).eq("day",TODAY_S), {ok:"Checked out at "+tm, logMsg:"Checked out at "+tm});
      else toast("You have already checked out today."); break; }
    case "goLetter": closeDrawer(); ui.letterEmp=id; ui.letterType=t.dataset.t; ui.letterOpts={}; location.hash="letters"; if(view==="letters") render(); break;
    case "copyLetter": copy($("#letterOut").innerText, "Letter text copied."); break;
    case "issueLetter": { const x=emp(ui.letterEmp), ref=pad(S.seq.letter); mutate(db.from("documents").insert({employee_id:x.id, name:LETTERS[ui.letterType]+" · ref "+ref, kind:"Letter", doc_date:TODAY_S, status:"Issued"}), {ok:"Letter filed in "+x.name.split(" ")[0]+"'s documents.", logMsg:`Issued ${LETTERS[ui.letterType]} to ${x.name} (ref ${ref})`}); break; }
    case "resign": { const x=emp(id), lwd=iso(addDays(TODAY,60));
      mutate(chain(()=>db.from("employees").update({status:"Notice", lwd}).eq("id",id), ()=>db.from("documents").insert({employee_id:id, name:"Resignation", kind:"Exit", doc_date:TODAY_S, status:"Received"})),
        {ok:"Resignation recorded. Last working day "+fmt(lwd)+".", logMsg:`Recorded resignation of ${x.name}; LWD ${fmt(lwd)} (60-day notice)`, after:()=>openDrawer(empDetail(id))}); break; }
    case "exit": { const x=emp(id); closeDrawer(); mutate(db.from("employees").update({status:"Exited"}).eq("id",id), {ok:x.name+" marked as exited.", logMsg:`Marked ${x.name} as exited`}); break; }
    case "verifyDoc": { const x=emp(id), d=x.docs.find(q=>q.id===t.dataset.doc); mutate(db.from("documents").update({status:"Verified"}).eq("id",d.id), {ok:"Document verified.", logMsg:`Verified ${d.name} for ${x.name}`, after:()=>{ openDrawer(empDetail(id)); document.querySelector('#drawer [data-t="docs"]').click(); }}); break; }
    case "copyPay": { const ms=ui.payMonth||curMonth(); const [y,mm]=ms.split("-").map(Number); const rows=S.employees.map(e=>({e,p:pay(e,y,mm-1)})).filter(r=>r.p); copy(["emp_id,name,payable_days,lop_days,gross_earned,basic_earned,ee_pf,ee_esi,pt,net_before_tds",...rows.map(({e,p})=>[e.id,'"'+e.name+'"',p.payable,p.lop,p.eGross,p.eBasic,p.eePF,p.eeESI,p.pt,p.net].join(","))].join("\n"),"Payroll inputs copied as CSV."); log("Exported payroll inputs for "+ms); break; }
    case "copyECR": copy(ecrText(),"ECR text copied."); log("Exported PF ECR for "+(ui.compMonth||"last month")); break;
    case "copyAudit": copy(["when,who,what",...S.audit.map(a=>[a.at,'"'+ename(a.by)+'"','"'+a.act.replace(/"/g,'""')+'"'].join(","))].join("\n"),"Audit trail copied."); break;
  }
});
document.addEventListener("keydown", e=>{
  if(e.key==="Escape") closeDrawer();
  if(e.key==="Enter" && e.target.matches("tr.click")) e.target.click();
});
$("#ov").addEventListener("click", e=>{ if(e.target.id==="ov") closeDrawer(); });
document.addEventListener("input", e=>{
  const t=e.target;
  if(t.id==="q"){ ui.q=t.value; ui.page=1; const pos=t.selectionStart; render(); const n=$("#q"); n.focus(); n.setSelectionRange(pos,pos); }
  if(t.closest("#leaveForm")) leaveCalc();
  if(["lo_date","lo_desig","lo_ctc"].includes(t.id)){ ui.letterOpts={date:$("#lo_date")?.value||"",desig:$("#lo_desig")?.value||"",ctc:+($("#lo_ctc")?.value)||""}; const holder=$("#letterOut").parentElement; holder.innerHTML=letterBody(emp(ui.letterEmp),ui.letterType,ui.letterOpts); }
});
document.addEventListener("change", e=>{
  const t=e.target;
  if(t.id==="fdept"){ ui.dept=t.value; ui.page=1; render(); }
  if(t.id==="fstatus"){ ui.status=t.value; ui.page=1; render(); }
  if(t.id==="payMonth"){ ui.payMonth=t.value; render(); }
  if(t.id==="compMonth"){ ui.compMonth=t.value; render(); }
  if(t.id==="lt_emp"){ ui.letterEmp=t.value; ui.letterOpts={}; render(); }
  if(t.id==="lt_type"){ ui.letterType=t.value; ui.letterOpts={}; render(); }
  if(t.id==="l_type"){ $("#l_note").textContent=LEAVE_TYPES[t.value].note; leaveCalc(); }
  if(t.id==="docUp" && t.files[0]){ const x=emp(t.dataset.emp), fname=t.files[0].name; mutate(db.from("documents").insert({employee_id:x.id, name:fname, kind:"Uploaded", doc_date:TODAY_S, status:role==="hr_admin"?"Verified":"Pending"}), {ok:"Document added.", logMsg:`Added document "${fname}" for ${x.name}`, after:()=>{ openDrawer(empDetail(x.id)); document.querySelector('#drawer [data-t="docs"]').click(); }}); }
});
function leaveCalc(){
  const f=$("#leaveForm"); if(!f) return;
  const type=f.type.value, from=f.from.value, to=f.to.value, box=$("#l_calc");
  if(!from||!to||to<from){ box.textContent="Pick a valid date range."; return; }
  const n=leaveDays(type,from,to), b=balances(me())[type];
  const hol = HOLIDAYS.filter(h=>h[0]>=from&&h[0]<=to).map(h=>h[1]);
  box.innerHTML = `<b>${n} ${LEAVE_TYPES[type].calendar?"calendar":"working"} day${n===1?"":"s"}</b>${hol.length?" · skips "+esc(hol.join(", ")):""}${b?` · ${b.left} left before this request`:""}${b&&n>b.left?' · <span style="color:var(--bad)">more than your balance</span>':""}${n>5||type==="ML"?" · goes to HR after your manager":""}`;
}
document.addEventListener("submit", e=>{
  e.preventDefault();
  const f=e.target;
  if(f.id==="empForm"){
    const {v,errs,aadNote} = validateEmp(f);
    if(Object.keys(errs).length){ const first=f.querySelector(".field.invalid input,.field.invalid select"); first&&first.focus(); toast("Fix the highlighted fields to continue."); return; }
    v.ctc=+v.ctc; v.manager=v.manager||null;
    const base={name:v.name, email:v.email, phone:v.phone, designation:v.designation.trim(), dept:v.dept, manager_id:v.manager, doj:v.doj, location:v.location, type:v.type, status:v.status};
    const sen={ctc:v.ctc, gender:v.gender, pan:v.pan, uan:v.uan||null, aadhaar_last4:v.aadhaarLast4, bank_last4:v.bankLast4||null};
    const btn=f.querySelector('[type=submit]'); btn.disabled=true;
    if(f.dataset.id){ const x=emp(f.dataset.id); const changed=Object.keys(v).filter(k=>String(x[k]??"")!==String(v[k]??""));
      mutate(chain(()=>db.from("employees").update(base).eq("id",x.id), ()=>db.from("employee_sensitive").upsert({employee_id:x.id, ...sen})),
        {ok:"Saved."+aadNote, logMsg:`Updated ${v.name} (${x.id}): ${changed.join(", ")||"no changes"}`, after:()=>openDrawer(empDetail(x.id))}).then(okd=>{ if(!okd) btn.disabled=false; }); }
    else { let nid;
      mutate(chain(()=>db.from("employees").insert(base).select("id").single(), r=>{ nid=r.data.id; return db.from("employee_sensitive").insert({employee_id:nid, ...sen}); }, ()=>db.from("documents").insert({employee_id:nid, name:"Offer letter", kind:"Letter", doc_date:v.doj, status:"Pending"})),
        {ok:v.name+" added.", logMsg:`Added employee ${v.name}`, after:()=>openDrawer(empDetail(nid))}).then(okd=>{ if(!okd) btn.disabled=false; else if(aadNote) toast(v.name+" added."+aadNote); }); }
  }
  if(f.id==="leaveForm"){
    const type=f.type.value, from=f.from.value, to=f.to.value, reason=f.reason.value.trim();
    const set=(k,m)=>{ const el=f.querySelector(`[data-f="${k}"]`); el.classList.toggle("invalid",!!m); el.querySelector(".err").textContent=m||""; };
    let bad=false; set("from"); set("to"); set("reason");
    if(!from){ set("from","Pick a start date."); bad=true; }
    if(!to||to<from){ set("to","End date must be on or after the start date."); bad=true; }
    if(!reason){ set("reason","Add a short reason."); bad=true; }
    const n = !bad ? leaveDays(type,from,to) : 0;
    if(!bad && n===0){ set("to","These dates are all weekends or holidays."); bad=true; }
    if(!bad && type==="CL" && n>3){ set("to","Casual leave is limited to 3 days at a stretch. Use earned leave instead."); bad=true; }
    const b=balances(me())[type];
    if(!bad && b && n>b.left){ set("to",`Only ${b.left} day(s) of ${LEAVE_TYPES[type].name.toLowerCase()} left. Shorten the dates or choose loss of pay.`); bad=true; }
    if(!bad && S.leaves.some(l=>l.emp===me()&&!["Rejected","Withdrawn"].includes(l.status)&&l.from<=to&&l.to>=from)){ set("from","You already have leave on some of these dates."); bad=true; }
    if(bad) return;
    const self = emp(me());
    const status = self.manager ? "Pending manager" : "Pending HR";
    f.querySelector('[type=submit]').disabled=true;
    mutate(db.from("leave_requests").insert({employee_id:me(), type, from_date:from, to_date:to, status, reason, history:[{at:nowStamp(),by:me(),act:"Applied"}]}),
      {ok:"Sent to "+ename(self.manager||"EMP002")+" for approval.", logMsg:`Applied for leave (${type}, ${n} days, ${fmt(from)} to ${fmt(to)})`});
  }
});
function loadScript(src, attrs={}){
  return new Promise((res,rej)=>{ const el=document.createElement("script"); el.src=src; el.crossOrigin="anonymous"; el.async=true;
    for(const [k,v] of Object.entries(attrs)) el.setAttribute(k,v);
    el.onload=res; el.onerror=()=>rej(new Error("Couldn't load "+src)); document.head.appendChild(el); });
}
async function loadClerk(){
  if(window.Clerk && window.Clerk.loaded) return window.Clerk;
  const domain = atob(CLERK_PUBLISHABLE_KEY.split("_")[2]).slice(0,-1);
  await loadScript(`https://${domain}/npm/@clerk/ui@1/dist/ui.browser.js`);
  await loadScript(`https://${domain}/npm/@clerk/clerk-js@6/dist/clerk.browser.js`, {"data-clerk-publishable-key": CLERK_PUBLISHABLE_KEY});
  await window.Clerk.load({ ui: { ClerkUI: window.__internal_ClerkUICtor } });
  let wasSignedIn = window.Clerk.isSignedIn;
  window.Clerk.addListener(()=>{ const now = !!window.Clerk.isSignedIn; if(now!==wasSignedIn){ wasSignedIn=now; now ? boot() : showLogin(); } });
  return window.Clerk;
}
function showLogin(msg, signedInButUnlinked){
  role=null; ME=null; closeDrawer();
  $(".app").classList.add("locked"); $("#nav").innerHTML="";
  $("#main").innerHTML = `<div class="login">
    <div class="card" style="display:flex;flex-direction:column;gap:6px"><h1>Sign in to Sahyadri HRIS</h1>
      <p style="margin:0;color:var(--muted)">Use your work email or Google account. Your role decides what you can see.</p>
      ${msg?`<p class="err" role="alert">${esc(msg)}</p>`:""}
      ${signedInButUnlinked?'<div><button class="btn" data-a="signout">Sign out and use another account</button></div>':""}
    </div>
    <div id="clerkSignIn"></div>
  </div>`;
  if(!signedInButUnlinked && window.Clerk && window.Clerk.loaded) window.Clerk.mountSignIn($("#clerkSignIn"), { fallbackRedirectUrl: location.href, signUpFallbackRedirectUrl: location.href });
}
async function boot(){
  $("#main").innerHTML = '<div class="empty">Loading…</div>';
  let C;
  try { C = await loadClerk(); } catch(e){ $("#main").innerHTML = `<div class="card login"><h1>Sign-in is unavailable</h1><p class="err">${esc(e.message)}. Check your internet connection and reload.</p></div>`; return; }
  if(!C.isSignedIn) return showLogin();
  const email = (C.user.primaryEmailAddress && C.user.primaryEmailAddress.emailAddress || "").toLowerCase();
  const {data:ur, error} = await db.from("app_logins").select("employee_id,role").eq("email", email).maybeSingle();
  if(error) return showLogin("Couldn't reach the database: "+error.message+". If this keeps happening, HR should check the Clerk and Supabase connection.", true);
  if(!ur) return showLogin(`${email} isn't linked to an employee record yet. Ask HR to add it.`, true);
  role = ur.role; ME = ur.employee_id; ui.leaveTab="apply";
  try { await loadAll(); } catch(e){ return showLogin("Couldn't load data: "+e.message, true); }
  $(".app").classList.remove("locked");
  $("#whoName").textContent = ename(ME)+" · "+ROLES[role].label;
  route();
}
window.addEventListener("hashchange", route);
boot();
})();
</script>
